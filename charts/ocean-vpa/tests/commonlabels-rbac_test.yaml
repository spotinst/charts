suite: ocean-vpa commonLabels on vpa-rbac resources
templates:
  - templates/vpa-rbac.yaml
tests:
  - it: applies commonLabels to each resource emitted by vpa-rbac.yaml
    set:
      commonLabels:
        environment: dev
        team: rightsizing
    asserts:
