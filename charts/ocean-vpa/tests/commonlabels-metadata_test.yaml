suite: ocean-vpa commonLabels on resource metadata (non-rbac)
templates:
  - templates/vpa-admission-controller-deployment.yaml
  - templates/vpa-updater-deployment.yaml
  - templates/vpa-admission-controller-service.yaml
  - templates/vpa-webhooks_mutating.yaml
  - templates/vpa-webhooks_jobs_certgen-clusterrole.yaml
  - templates/vpa-webhooks_jobs_certgen-clusterrolebinding.yaml
  - templates/vpa-webhooks_jobs_certgen-role.yaml
  - templates/vpa-webhooks_jobs_certgen-role_delete_secret.yaml
  - templates/vpa-webhooks_jobs_certgen-rolebinding_delete_secret.yaml
  - templates/vpa-webhooks_jobs_certgen-sa.yaml
  - templates/vpa-webhooks_jobs_certgen-create.yaml
  - templates/vpa-webhooks_jobs_certgen-patch.yaml
  - templates/vpa-webhooks_jobs_secret-delete.yaml
tests:
  - it: applies commonLabels to admission controller deployment metadata and preserves existing labels
    template: templates/vpa-admission-controller-deployment.yaml
    set:
      commonLabels:
        environment: dev
        team: rightsizing
    asserts:
      - equal:
          path: metadata.labels.environment
          value: dev
      - equal:
          path: metadata.labels.team
          value: rightsizing
      - exists:
          path: metadata.labels["helm.sh/chart"]
      - exists:
          path: metadata.labels["app.kubernetes.io/name"]
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: admission-controller

  - it: applies commonLabels to updater deployment metadata and preserves existing labels
    template: templates/vpa-updater-deployment.yaml
    set:
      commonLabels:
        environment: dev
        team: rightsizing
    asserts:
      - equal:
          path: metadata.labels.environment
          value: dev
      - equal:
          path: metadata.labels.team
          value: rightsizing
      - exists:
          path: metadata.labels["helm.sh/chart"]
      - exists:
          path: metadata.labels["app.kubernetes.io/name"]
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: updater

  - it: applies commonLabels to webhook service metadata
    template: templates/vpa-admission-controller-service.yaml
    set:
      commonLabels:
        environment: dev
        team: rightsizing
    asserts:
      - equal:
          path: metadata.labels.environment
          value: dev
      - equal:
          path: metadata.labels.team
          value: rightsizing
      - exists:
          path: metadata.labels["helm.sh/chart"]
      - exists:
          path: metadata.labels["app.kubernetes.io/name"]

  - it: applies commonLabels to mutating webhook configuration metadata and preserves component label
    template: templates/vpa-webhooks_mutating.yaml
    set:
      commonLabels:
        environment: dev
        team: rightsizing
    asserts:
      - equal:
          path: metadata.labels.environment
          value: dev
      - equal:
          path: metadata.labels.team
          value: rightsizing
      - exists:
          path: metadata.labels["helm.sh/chart"]
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: admission-controller

  - it: applies commonLabels to webhook certgen clusterrole metadata
    template: templates/vpa-webhooks_jobs_certgen-clusterrole.yaml
    set:
      commonLabels:
