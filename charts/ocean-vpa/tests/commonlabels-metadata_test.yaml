        team: rightsizing
    asserts:
      - equal:
          path: metadata.labels.environment
          value: dev
      - equal:
          path: metadata.labels.team
          value: rightsizing
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: admission-certgen

  - it: applies commonLabels to webhook certgen clusterrolebinding metadata
